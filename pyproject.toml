[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wideband_performance"
version = "0.1.0"
description = "A high-performance hardware abstraction layer and testing framework for RF instruments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyVISA>=1.13.0",
    "PyVISA-py>=0.7.1",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "black>=23.0"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["wideband_performance*"]
