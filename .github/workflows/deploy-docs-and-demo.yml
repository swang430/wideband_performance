name: Deploy Docs and Demo GUI to GitHub Pages

on:
  push:
    branches:
      - main
      - core-rf-drivers
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install MkDocs
        run: |
          pip install mkdocs-material mkdocstrings[python]
          pip install -e .
          
      - name: Build Docs
        run: mkdocs build
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build Demo GUI (Simulation Mode)
        working-directory: ./frontend
        run: |
          npm install
          npm run build:demo
          
      - name: Merge Sites
        run: |
          # Copy frontend dist to docs site under /demo
          cp -R frontend/dist site/demo
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4